# Only non-default GTNHGradle settings; see GTNewHorizons/ExampleMod1.7.10 for the full list.
gtnh.settings.blowdryerTag = 0.2.2
modName = GTNH MCP
modId = gtnhmcp
modGroup = dev.gtnhmcp
minecraftVersion = 1.7.10
forgeVersion = 10.13.4.1614
autoUpdateBuildScript = false
generateGradleTokenClass = dev.gtnhmcp.Tags
gradleTokenVersion = VERSION

# The MCP SDK, Jetty and Jackson 3 need Java 17+; GTNH runs on 17-25 via lwjgl3ify.
enableModernJavaSyntax = modern
forceToolchainVersion = 17

# Shaded libraries load classes reflectively, so they must not be minimized.
usesShadowedDependencies = true
minimizeShadowedDependencies = false
usesMavenPublishing = false

org.gradle.configuration-cache = true
org.gradle.parallel = true
