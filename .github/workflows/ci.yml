name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@v6.4.0
      # Format (spotless), checkstyle, and the shaded, reobfuscated jar.
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gtnh-mcp
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-dev*.jar
            !mod/build/libs/*-sources.jar
            !mod/build/libs/*-preshadow.jar
